name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package. Defaults to the workflow branch.
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: Package (cross)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/upload the GitHub Release on a tag push
    # One GitHub-hosted Linux runner builds every target. `qg-release
    # package --allow-cross` cross-compiles (GOOS/GOARCH) and skips the native
    # smoke it cannot run for a foreign target; `qg-release verify` re-checks
    # every archive + checksum, and the publish-npm job probes the uploaded
    # assets over HTTPS before anything reaches npm.

    steps:
      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Checkout requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      # qg-release names assets qg-v<package.json version>-… while the release
      # is published under the pushed git tag. If they disagree, install.sh/install.ps1
      # and the npm postinstall all build a download URL that 404s. Fail fast so a
      # forgotten version bump can never publish mis-versioned, un-installable assets.
      # Matches on the ref (not event_name) so the tag-only steps stay off for
      # manual workflow_dispatch runs that are not at a tag ref.
      - name: Check tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "v$pkg_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$pkg_version — bump package.json before tagging so the release assets and the npm package agree." >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json version v$pkg_version."

      # The release link points at CHANGELOG.md at the tag, so a missing
      # section would open an empty page. Fail fast so the section is always
      # written in the same commit as the version bump (see docs/RELEASING.md).
      - name: Check CHANGELOG has the release section
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: scripts/check-changelog.sh "${GITHUB_REF_NAME#v}"

      - name: Package release artifacts (all targets)
        shell: bash
        run: |
          set -euo pipefail
          while read -r goos goarch; do
            echo "packaging ${goos}/${goarch}"
            go run ./cmd/qg-release package --goos "$goos" --goarch "$goarch" --allow-cross
          done <<'EOF'
          darwin arm64
          darwin amd64
          linux arm64
          linux amd64
          windows amd64
          windows arm64
          EOF

      - name: Verify release checksums
        run: go run ./cmd/qg-release verify

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qg-release-assets
          path: dist/release/*
          if-no-files-found: error

      # On a `v*` tag ref (pushed manually), publish the packaged archive + .sha256 as GitHub
      # Release assets so the documented `scripts/install.sh` / `install.ps1` path
      # (which reads /releases/latest) works. Uses the preinstalled `gh` (no new
      # action dependency); creates the release if absent, then uploads its
      # own assets with --clobber.
      - name: Publish to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes 2>/dev/null || true
          gh release upload "$tag" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber

  # Publishes @quebragalho/cli to npm: first the six platform payloads (versions
  # of the SAME package at suffixed versions like X.Y.Z-linux-x64, carrying the
  # native binary + vendored helpers), then the wrapper at X.Y.Z whose
  # optionalDependencies alias those platform versions. Platform versions MUST
  # publish first — the wrapper pins them exactly, so the reverse order would
  # open a window where installs resolve aliases that 404. See
  # docs/NPM_PACKAGING.md for the full contract.
  #
  # Auth is npm OIDC trusted publishing: no NPM_TOKEN secret. The package's
  # npmjs.com settings must list this repo + workflow file as a trusted
  # publisher, and provenance is then generated automatically. Note npm only
  # allows configuring a trusted publisher on an EXISTING package, so the very
  # first @quebragalho/cli publish is a one-time manual `npm publish` bootstrap
  # (docs/NPM_PACKAGING.md). Because the platform payloads are versions of the
  # same package, they reuse that single trusted-publisher configuration. The
  # bridge release under @quebragalho-dev/cli uses that package's own trusted
  # publisher, which already names this repo and workflow.
  publish-npm:
    name: Publish npm package
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Manual approval gate: this environment carries a required-reviewer rule
    # (Settings -> Environments -> npm-publish), so the job pauses until a
    # maintainer approves it in the Actions UI before anything reaches npm.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@quebragalho/cli
    permissions:
      contents: read
      id-token: write # OIDC token exchange for npm trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # No registry-url here on purpose: setup-node's registry-url writes an
      # .npmrc line referencing $NODE_AUTH_TOKEN, and npm hard-fails on the
      # unset env var. Trusted publishing needs no token at all.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # OIDC trusted publishing needs npm >= 11.5.1. Use the npm bundled with
      # the pinned Node toolchain (Node 24 ships >= 11.5.1) rather than pulling
      # npm@latest from the registry inside the publish path — an unpinned
      # install there would be avoidable supply-chain exposure. Fail fast if a
      # future runner/toolchain change ever regresses the bundled npm.
      - name: Check npm supports trusted publishing
        run: |
          npm --version | node -e '
            const version = require("fs").readFileSync(0, "utf8").trim();
            const [major, minor, patch] = version.split(".").map(Number);
            const ok =
              major > 11 ||
              (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(
                `::error::bundled npm ${version} is too old for OIDC trusted ` +
                  `publishing (needs >= 11.5.1) — bump node-version in this job.`,
              );
              process.exit(1);
            }
            console.log(`npm ${version} supports trusted publishing.`);
          '

      # Probe the exact URLs the wrapper's first-run downloader builds
      # (internal/release/release.go asset-name scheme) as an anonymous client
      # — install.sh/install.ps1 and `qg update` read them too. This also
      # blocks publishing while the repo is still private: private release
      # assets 404 without auth, exactly as they would for an installing user.
      - name: Verify release assets are downloadable
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          for asset in \
            "qg-v${version}-linux-x64.tar.gz" \
            "qg-v${version}-linux-arm64.tar.gz" \
            "qg-v${version}-macos-x64.tar.gz" \
            "qg-v${version}-macos-arm64.tar.gz" \
            "qg-v${version}-windows-x64.zip" \
            "qg-v${version}-windows-arm64.zip"; do
            for url in "${base}/${asset}" "${base}/${asset}.sha256"; do
              if ! curl -fsSLI -o /dev/null "$url"; then
                echo "::error::${url} is not publicly downloadable — the wrapper's fallback downloader and install.sh would fail. Is the repo public and are all assets uploaded?" >&2
                exit 1
              fi
            done
          done
          echo "all release assets for v${version} are publicly downloadable."

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qg-*
          path: dist/artifacts
          merge-multiple: true

      - name: Assemble npm packages
        run: node scripts/npm/build-platform-packages.mjs --artifacts-dir dist/artifacts --out-dir dist/npm

      # Platform versions are semver PRERELEASES of the wrapper version
      # (X.Y.Z-linux-x64), so they must never publish under the default
      # `latest` dist-tag — that would make `npm install @quebragalho/cli`
      # deliver a platform payload as the CLI. publish-packages.sh publishes
      # them under a dedicated tag, asserts `latest` survived, publishes the
      # wrapper, then asserts `latest` is the wrapper version. It skips
      # versions already on the registry, so a re-run after a failure in the
      # middle is safe.
      - name: Publish npm packages
        shell: bash
        run: scripts/npm/publish-packages.sh dist/npm

      # Bridge: one release under the pre-rename name @quebragalho-dev/cli.
      # qg 0.0.15 and older check and update that name, so without a newer
      # version there they would stay where they are, with no notice. This
      # release goes out once more under it: the same verified artifacts,
      # assembled as @quebragalho-dev/cli, whose wrapper moves the install to
      # @quebragalho/cli right after the update (docs/NPM_PACKAGING.md). Runs
      # after the @quebragalho/cli publish, so the package it moves to exists.
      #
      # The gate keeps this to a single release: it is owed only while the old
      # name's latest is still the last pre-rename version, or is this version
      # (a re-run after it went out). After this release, `npm deprecate` the
      # old package and delete these two steps.
      - name: Check whether the bridge release under @quebragalho-dev/cli is owed
        id: legacy-name
        shell: bash
        env:
          LAST_PRE_RENAME_VERSION: 0.0.15
        run: |
          version="$(node -p "require('./package.json').version")"
          latest=""
          for attempt in 1 2 3; do
            latest="$(npm view @quebragalho-dev/cli dist-tags.latest 2>/dev/null || true)"
            if [ -n "$latest" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$latest" ]; then
            echo "::error::could not read the latest dist-tag of @quebragalho-dev/cli from the registry" >&2
            exit 1
          fi
          if [ "$latest" = "$LAST_PRE_RENAME_VERSION" ] || [ "$latest" = "$version" ]; then
            owed=true
          else
            owed=false
          fi
          echo "@quebragalho-dev/cli latest is ${latest}; bridge release owed: ${owed}"
          echo "owed=${owed}" >> "$GITHUB_OUTPUT"

      - name: Publish the bridge release under @quebragalho-dev/cli
        if: ${{ steps.legacy-name.outputs.owed == 'true' }}
        shell: bash
        run: |
          node scripts/npm/build-platform-packages.mjs \
            --artifacts-dir dist/artifacts --out-dir dist/npm-legacy --package-name @quebragalho-dev/cli
          scripts/npm/publish-packages.sh dist/npm-legacy
