name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        run: make lint

      - name: golangci-lint
        run: make lint-static

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage
        run: |
          go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | awk '
            BEGIN {
              total = "unknown"
              rows = ""
            }
            $1 == "total:" {
              total = $3
              next
            }
            {
              rows = rows sprintf("| `%s` | `%s` | **%s** |\n", $1, $2, $3)
            }
            END {
              print "### 📊 Test Coverage Summary: **" total "**"
              print "<details><summary>Coverage per function</summary>\n"
              print "| File | Function | Coverage |"
              print "| :--- | :--- | :--- |"
              printf "%s", rows
              print "</details>"
            }' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qg-coverage-report
          path: coverage.out
          if-no-files-found: warn

  test-macos:
    name: Unit Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (macOS, no race)
        run: go test -count=1 ./...

  test-windows:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      # The runner's git converts line endings on checkout by default, and
      # .gitattributes pins LF only for source files. Fixtures and scripts must
      # reach the tests with the bytes that are in the repository.
      - name: Keep repository line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (Windows, no race)
        run: go test -count=1 -timeout 35m ./...

  smoke:
    name: Smoke + cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go run ./cmd/qg-release build

      - name: Smoke binary
        run: go run ./cmd/qg-release smoke

      # This job runs on Linux: darwin/windows coverage here is a
      # cross-compile check. Native tests live in test-macos and test-windows.
      # darwin-amd64 is included for the Intel package.
      - name: Cross-compile release targets
        shell: bash
        run: |
          set -euo pipefail
          while read -r goos goarch; do
            echo "building ${goos}/${goarch}"
            go run ./cmd/qg-release build --goos "$goos" --goarch "$goarch"
          done <<'EOF'
          darwin arm64
          darwin amd64
          linux arm64
          linux amd64
          windows amd64
          windows arm64
          EOF

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A race the detector newly reports can present as a deadlock rather than a
    # failure, and the default job timeout is six hours. This job is expected to
    # be the longest in the workflow, so the ceiling is generous but finite.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      # Invoke the Makefile target rather than repeating its flags. `make test`
      # is already `go test ./... -race -count=1 -timeout 25m`, so running it
      # here is what stops the project's declared test command and what CI
      # actually runs from drifting apart again. The race detector needs cgo,
      # which the GitHub-hosted Ubuntu runner supplies without an extra
      # setup step.
      - name: Test with the race detector
        run: make test

  security:
    name: Security & Code Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck (linux)
        run: make vulncheck

      - name: govulncheck (windows)
        run: make vulncheck-windows
