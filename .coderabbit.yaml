# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
tone_instructions: "Be direct and prioritize actionable correctness, safety, CLI UX, and test coverage issues over style nits."

reviews:
  profile: "chill"
  # Allow explicit @coderabbitai approve / resolve commands to submit review verdicts.
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  # Avoid noisy "review skipped" status comments when CodeRabbit decides not to run.
  review_status: false
  collapse_walkthrough: false
  path_filters:
    - "!dist/**"
    - "!out/**"
    - "!coverage/**"
    - "!*.tgz"
    - "!/qg"
    - "!/qg.exe"
  path_instructions:
    - path: "**/*.go"
      instructions: |
        Do not request Plan 9 or other unsupported GOOS/GOARCH shims. The six native prebuilt release targets are linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64, and windows-arm64. Android/Termux is also a supported runtime through the documented android-arm64 source build and Linux artifact fallback. Other GOOS/GOARCH combinations are not a review criterion.
  tools:
    github-checks:
      timeout_ms: 300000
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 10
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[skip review]"
    labels:
      - "!do-not-review"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
      - "github-actions[bot]"
    # CodeRabbit reviews default-branch PRs by default. This extends automatic
    # reviews to PRs targeting any branch, including release and stacked branches.
    base_branches:
      - ".*"
